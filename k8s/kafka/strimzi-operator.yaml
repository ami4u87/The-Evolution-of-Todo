# =============================================================================
# Strimzi Kafka Operator - Installation Reference
# =============================================================================
# The Strimzi operator is installed via its official Helm chart or YAML.
# This file provides the kubectl-based installation commands.
#
# Install Strimzi operator:
#   kubectl create namespace kafka
#   kubectl create -f 'https://strimzi.io/install/latest?namespace=kafka' -n kafka
#
# Or via Helm:
#   helm repo add strimzi https://strimzi.io/charts/
#   helm install strimzi-kafka-operator strimzi/strimzi-kafka-operator \
#     --namespace kafka --create-namespace
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/managed-by: strimzi
