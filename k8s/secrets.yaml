# =============================================================================
# Kubernetes Secrets for Todo App
# =============================================================================
# IMPORTANT: Replace the placeholder values before applying!
#
# Option 1: Edit this file directly (not recommended for git)
# Option 2: Use kubectl create secret:
#   kubectl create secret generic todo-secrets \
#     --namespace todo-app \
#     --from-literal=DATABASE_URL="postgresql://..." \
#     --from-literal=BETTER_AUTH_SECRET="your-secret" \
#     --from-literal=GROQ_API_KEY="your-key"
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
  namespace: todo-app
  labels:
    app.kubernetes.io/name: todo-app
type: Opaque
stringData:
  # Neon PostgreSQL connection string
  # Format: postgresql://user:password@host.neon.tech/dbname?sslmode=require
  DATABASE_URL: "REPLACE_WITH_YOUR_NEON_DATABASE_URL"

  # Better Auth shared secret (minimum 32 characters)
  BETTER_AUTH_SECRET: "REPLACE_WITH_YOUR_SECRET_MIN_32_CHARS"

  # Groq API key (for AI chat feature)
  GROQ_API_KEY: "REPLACE_WITH_YOUR_GROQ_API_KEY"

  # OpenAI API key (optional, alternative to Groq)
  OPENAI_API_KEY: ""
